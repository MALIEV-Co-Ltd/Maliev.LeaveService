name: Reusable Validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MALIEV_TEST_RESOURCE_OWNER: leave-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Leave service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: service
          persist-credentials: false
      - name: Checkout shared Aspire defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: d79f954b2e7224b48bec75af4826bb38dd5f2a20
          path: Maliev.Aspire
          persist-credentials: false
      - name: Checkout shared messaging contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 2347023e8aa17dfd7071317c2ee5c4436e1d945a
          path: Maliev.MessagingContracts
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 11.0.100
      - name: Restore
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet restore Maliev.LeaveService.slnx --configfile nuget.validation.config
      - name: Audit dependencies
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet list Maliev.LeaveService.slnx package --vulnerable --include-transitive --no-restore
      - name: Verify formatting
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet format Maliev.LeaveService.slnx --verify-no-changes --no-restore
      - name: Build
        working-directory: service
        run: GITHUB_ACTIONS=false dotnet build Maliev.LeaveService.slnx --configuration Release --no-restore
      - name: Verify custody controls
        working-directory: service
        run: |
          python3 -B scripts/test-verify-leave-custody.py
          python3 -B scripts/test-verify-leave-coverage.py
      - name: Test
        id: tests
        timeout-minutes: 23
        working-directory: service
        shell: bash
        env:
          MALIEV_RESOURCE_LEDGER: ${{ runner.temp }}/leave-resource-ledger
        run: |
          set -euo pipefail
          test ! -e "$MALIEV_RESOURCE_LEDGER"
          mkdir -m 700 "$MALIEV_RESOURCE_LEDGER"
          GITHUB_ACTIONS=false timeout --signal=TERM --kill-after=10s 1200s dotnet test Maliev.LeaveService.slnx --configuration Release --no-build --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory runner-results
      - name: Verify owned resource cleanup
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 3
        working-directory: service
        env:
          LEAVE_TEST_OUTCOME: ${{ steps.tests.outcome }}
          MALIEV_RESOURCE_LEDGER: ${{ runner.temp }}/leave-resource-ledger
        run: python3 -B scripts/verify-leave-custody.py
      - name: Require owned assembly coverage
        working-directory: service
        run: python3 -B scripts/verify-leave-coverage.py runner-results
      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks
          ./gitleaks dir service --no-banner --redact
